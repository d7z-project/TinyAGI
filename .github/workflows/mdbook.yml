name: Documentation

on:
  push:
    paths:
      - '*.md'
      - 'docs/**'
      - 'scripts/docs.py'
      - 'book.toml'
      - '.gitignore'
      - '.github/workflows/mdbook.yml'
  pull_request:
    paths:
      - '*.md'
      - 'docs/**'
      - 'scripts/docs.py'
      - 'book.toml'
      - '.gitignore'
      - '.github/workflows/mdbook.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check publication inputs
        run: python3 scripts/docs.py check

      - name: Install pinned mdBook and Mermaid tools
        shell: bash
        run: |
          set -euo pipefail
          tools_dir="$RUNNER_TEMP/doc-tools"
          mkdir -p "$tools_dir"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz \
            --output "$tools_dir/mdbook.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/badboy/mdbook-mermaid/releases/download/v0.17.1/mdbook-mermaid-v0.17.1-x86_64-unknown-linux-gnu.tar.gz \
            --output "$tools_dir/mermaid.tar.gz"
          cd "$tools_dir"
          echo '3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7  mdbook.tar.gz' | sha256sum --check
          echo '9afcfa5b8463afe606d48595a7ae338564302903e626ea5b6edb8007d29393a5  mermaid.tar.gz' | sha256sum --check
          tar -xzf mdbook.tar.gz mdbook
          tar -xzf mermaid.tar.gz mdbook-mermaid
          echo "$tools_dir" >> "$GITHUB_PATH"

      - name: Read Pages configuration
        id: pages
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/configure-pages@v5

      - name: Build and check the book
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: python3 scripts/docs.py build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@v4
        with:
          path: book

  deploy:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
